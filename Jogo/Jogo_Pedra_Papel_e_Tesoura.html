<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra, Papel e Tesoura</title>
  <style>
    :root {
      --bg-1: #1e1b4b;
      --bg-2: #4338ca;
      --card: rgba(255, 255, 255, 0.10);
      --card-border: rgba(255, 255, 255, 0.20);
      --text: #f8fafc;
      --muted: #c7d2fe;
      --win: #22c55e;
      --lose: #ef4444;
      --draw: #f59e0b;
      --accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }
    .game {
      width: 100%;
      max-width: 640px;
      padding: 32px 24px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .score-box {
      padding: 12px 8px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
    }
    .score-box .label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .score-box .value {
      font-size: 2rem;
      font-weight: 700;
      transition: transform 0.2s ease;
    }
    .score-box .value.pop {
      transform: scale(1.4);
    }
    .score-box.player .value   { color: var(--win); }
    .score-box.computer .value { color: var(--lose); }
    .score-box.draw .value     { color: var(--draw); }
    .choices {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .choice-btn {
      width: 120px;
      padding: 16px 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      transition: transform 0.2s ease, background 0.2s ease,
                  border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .choice-btn .emoji {
      display: block;
      font-size: 2.8rem;
      margin-bottom: 6px;
    }
    .choice-btn:hover {
      transform: translateY(-6px);
      background: rgba(129, 140, 248, 0.35);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    .choice-btn:active {
      transform: translateY(-2px) scale(0.97);
    }
    .choice-btn:focus-visible,
    .reset-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .fighter {
      padding: 16px 8px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.25);
    }
    .fighter .who {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .fighter .hand {
      font-size: 3.6rem;
      min-height: 4.4rem;
      line-height: 1.2;
    }
    .fighter .name {
      font-weight: 600;
      min-height: 1.4rem;
    }
    .vs {
      font-weight: 800;
      color: var(--muted);
    }
    .hand.shake {
      animation: shake 0.5s ease;
    }
    @keyframes shake {
      0%   { transform: translateY(0) rotate(0); }
      25%  { transform: translateY(-14px) rotate(-12deg); }
      50%  { transform: translateY(0) rotate(10deg); }
      75%  { transform: translateY(-8px) rotate(-6deg); }
      100% { transform: translateY(0) rotate(0); }
    }
    .result {
      min-height: 3.2rem;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .result.win  { background: rgba(34, 197, 94, 0.25);  color: #bbf7d0; }
    .result.lose { background: rgba(239, 68, 68, 0.25);  color: #fecaca; }
    .result.draw { background: rgba(245, 158, 11, 0.25); color: #fde68a; }

    .reset-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      background: transparent;
      border: 2px solid var(--accent);
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .reset-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }
    @media (max-width: 480px) {
      .game { padding: 24px 14px; }
      .choice-btn { width: 96px; }
      .choice-btn .emoji { font-size: 2.2rem; }
      .fighter .hand { font-size: 2.8rem; }
      .arena { gap: 6px; }
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>Pedra, Papel e Tesoura</h1>
    <p class="subtitle">Escolha uma opção e desafie o computador!</p>

    <section class="scoreboard" aria-label="Placar">
      <div class="score-box player">
        <div class="label">Você</div>
        <div class="value" id="score-player">0</div>
      </div>
      <div class="score-box draw">
        <div class="label">Empates</div>
        <div class="value" id="score-draw">0</div>
      </div>
      <div class="score-box computer">
        <div class="label">Computador</div>
        <div class="value" id="score-computer">0</div>
      </div>
    </section>

    <section class="choices" aria-label="Escolha sua jogada">
      <button class="choice-btn" data-choice="pedra">
        <span class="emoji">✊</span>Pedra
      </button>
      <button class="choice-btn" data-choice="papel">
        <span class="emoji">✋</span>Papel
      </button>
      <button class="choice-btn" data-choice="tesoura">
        <span class="emoji">✌️</span>Tesoura
      </button>
    </section>

    <section class="arena" aria-live="polite">
      <div class="fighter">
        <div class="who">Sua escolha</div>
        <div class="hand" id="player-hand">❔</div>
        <div class="name" id="player-name"></div>
      </div>

      <div class="vs">VS</div>

      <div class="fighter">
        <div class="who">Computador</div>
        <div class="hand" id="computer-hand">❔</div>
        <div class="name" id="computer-name"></div>
      </div>
    </section>

    <div class="result" id="result" aria-live="polite">Faça sua jogada!</div>

    <button class="reset-btn" id="reset-btn">🔄 Reiniciar jogo</button>
  </main>

  <script>

    const OPTIONS = {
      pedra:   { name: "Pedra",   emoji: "✊",  beats: "tesoura" },
      papel:   { name: "Papel",   emoji: "✋",  beats: "pedra"   },
      tesoura: { name: "Tesoura", emoji: "✌️", beats: "papel"   }
    };
    const score = { player: 0, computer: 0, draw: 0 };
    const scorePlayerEl   = document.getElementById("score-player");
    const scoreComputerEl = document.getElementById("score-computer");
    const scoreDrawEl     = document.getElementById("score-draw");
    const playerHandEl    = document.getElementById("player-hand");
    const computerHandEl  = document.getElementById("computer-hand");
    const playerNameEl    = document.getElementById("player-name");
    const computerNameEl  = document.getElementById("computer-name");
    const resultEl        = document.getElementById("result");

    function getComputerChoice() {
      const keys = Object.keys(OPTIONS);
      const index = Math.floor(Math.random() * keys.length);
      return keys[index];
    }
    function getResult(player, computer) {
      if (player === computer) return "draw";
      if (OPTIONS[player].beats === computer) return "win";
      return "lose";
    }
    function popScore(element) {
      element.classList.add("pop");
      setTimeout(() => element.classList.remove("pop"), 200);
    }
    function updateScoreboard(changed) {
      scorePlayerEl.textContent   = score.player;
      scoreComputerEl.textContent = score.computer;
      scoreDrawEl.textContent     = score.draw;

      if (changed === "win")  popScore(scorePlayerEl);
      if (changed === "lose") popScore(scoreComputerEl);
      if (changed === "draw") popScore(scoreDrawEl);
    }

    function showChoices(player, computer) {
      playerHandEl.textContent   = OPTIONS[player].emoji;
      computerHandEl.textContent = OPTIONS[computer].emoji;
      playerNameEl.textContent   = OPTIONS[player].name;
      computerNameEl.textContent = OPTIONS[computer].name;

      [playerHandEl, computerHandEl].forEach(el => {
        el.classList.remove("shake");
        void el.offsetWidth; 
        el.classList.add("shake");
      });
    }

    function showResult(result, player, computer) {
      const messages = {
        win:  `🎉 Você venceu! ${OPTIONS[player].name} vence ${OPTIONS[computer].name}.`,
        lose: `😢 O computador venceu! ${OPTIONS[computer].name} vence ${OPTIONS[player].name}.`,
        draw: `🤝 Empate! Ambos escolheram ${OPTIONS[player].name}.`
      };

      resultEl.textContent = messages[result];
      resultEl.className = "result " + result;
    }

    function playRound(playerChoice) {
      const computerChoice = getComputerChoice();
      const result = getResult(playerChoice, computerChoice);
      if (result === "win")  score.player++;
      if (result === "lose") score.computer++;
      if (result === "draw") score.draw++;

      showChoices(playerChoice, computerChoice);
      showResult(result, playerChoice, computerChoice);
      updateScoreboard(result);
    }
    function resetGame() {
      score.player = 0;
      score.computer = 0;
      score.draw = 0;

      updateScoreboard();
      playerHandEl.textContent   = "❔";
      computerHandEl.textContent = "❔";
      playerNameEl.textContent   = "";
      computerNameEl.textContent = "";
      resultEl.textContent = "Faça sua jogada!";
      resultEl.className = "result";
    }
    document.querySelectorAll(".choice-btn").forEach(button => {
      button.addEventListener("click", () => {
        playRound(button.dataset.choice);
      });
    });
    document.getElementById("reset-btn").addEventListener("click", resetGame);
  </script>
</body>
</html>
